      function cls(...a){ return a.filter(Boolean).join(' '); }

      const DEFAULT_SETTINGS = {
      baseUrl: 'http://localhost:11434',
      apiKey: '',
      model: '',
      bilingual: true,
      theme: 'dark',
      accent: 'en-US',
      rate: 1.0,
      autoPlay: false,
      };

      function normalizeSettings(s) {
      return { ...DEFAULT_SETTINGS, ...(s || {}) };
      }

      function useLocalStorage(key, initial) {
      const [val, setVal] = useState(() => {
      try {
      const r = localStorage.getItem(key);
      if (r) return JSON.parse(r);
      return typeof initial === 'function' ? initial() : initial;
      } catch {
      return typeof initial === 'function' ? initial() : initial;
      }
      });
      useEffect(() => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }, [key, val]);
      return [val, setVal];
      }

      function safeText(v) {
      if (v == null) return '';
      if (typeof v === 'string') return v;
      if (Array.isArray(v)) return v.map(safeText).join(', ');
      if (typeof v === 'object') {
      return v.pt || v['pt-BR'] || v.pt_br || v.en || v['en-US'] || Object.values(v).map(safeText).join(' ');
      }
      return String(v);
      }

      function normalizeVocabData(data) {
      if (!data) return null;
      return {
      translation: safeText(data.translation),
      definition: safeText(data.definition),
      examples: Array.isArray(data.examples) ? data.examples.map(safeText) : (data.examples ? [safeText(data.examples)] : []),
      };
      }

      function parseJSON(text) {
      if (!text) return null;
      let t = text.trim();
      const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if (fence) t = fence[1].trim();
      try { return JSON.parse(t); } catch {}
      const s = t.indexOf('{'), e = t.lastIndexOf('}');
      if (s !== -1 && e !== -1) { try { return JSON.parse(t.slice(s, e + 1)); } catch {} }
      return null;
      }

      function authHeaders(apiKey) {
      const h = {};
      if (apiKey) h['Authorization'] = `Bearer ${apiKey}`;
      return h;
      }

      async function ollamaFetchModels(baseUrl, apiKey) {
      const url = `${baseUrl.replace(/\/$/, '')}/api/tags`;
      const res = await fetch(url, { headers: authHeaders(apiKey) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return (data.models || []).map(m => m.name);
      }

      async function ollamaChat(baseUrl, apiKey, model, messages, systemPrompt, temperature = 0.2) {
      const base = baseUrl.replace(/\/$/, '');
      const msgs = systemPrompt ? [{ role: 'system', content: systemPrompt }, ...messages] : messages;
      try {
      const res = await fetch(`${base}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders(apiKey) },
      body: JSON.stringify({ model, messages: msgs, stream: false, options: {temperature: temperature} })
      });
      if (res.ok) {
      const data = await res.json();
      if (data.message?.content) return data.message.content;
      if (data.choices?.[0]?.message?.content) return data.choices[0].message.content;
      }
      if (res.status !== 404) {
      const txt = await res.text().catch(()=> '');
      throw new Error(`Ollama error ${res.status}: ${txt.slice(0,200)}`);
      }
      } catch (e) {
      if (!/404/.test(String(e.message))) throw e;
      }
      const res = await fetch(`${base}/v1/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders(apiKey) },
      body: JSON.stringify({ model, messages: msgs, stream: false })
      });
      if (!res.ok) {
      const txt = await res.text().catch(()=> '');
      throw new Error(`Ollama error ${res.status}: ${txt.slice(0,200)}`);
      }
      const data = await res.json();
      return data.choices?.[0]?.message?.content ?? data.message?.content ?? '';
      }

      const SpeechRec = (typeof window !== 'undefined') && (window.SpeechRecognition || window.webkitSpeechRecognition);

      function useTTS(settings) {
      const [voices, setVoices] = useState([]);
      useEffect(() => {
      const load = () => setVoices(window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
      if (window.speechSynthesis) {
      load();
      window.speechSynthesis.onvoiceschanged = load;
      }
      }, []);
      const speak = useCallback((text) => {
      if (!window.speechSynthesis || !text) return;
      try { window.speechSynthesis.cancel(); } catch {}
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = settings.accent;
      u.rate = parseFloat(settings.rate) || 1;
      const v = voices.find(x => x.lang === settings.accent) || voices.find(x => x.lang && x.lang.startsWith(settings.accent.split('-')[0]));
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
      }, [settings.accent, settings.rate, voices]);
      const stop = useCallback(() => { try { window.speechSynthesis.cancel(); } catch {} }, []);
      return { speak, stop, voices };
      }

      /* ---------------- UI primitives ---------------- */
      function Button({ children, onClick, variant='primary', className='', disabled=false, type='button' }) {
      const base = 'inline-flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition disabled:opacity-50 disabled:cursor-not-allowed shadow-sm';
      const styles = {
      primary: 'bg-primary text-white hover:bg-indigo-500',
      secondary: 'bg-slate-200 text-slate-900 dark:bg-slate-800 dark:text-slate-100 hover:bg-slate-300 dark:hover:bg-slate-700',
      ghost: 'text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800',
      danger: 'bg-red-600 text-white hover:bg-red-500',
      accent: 'bg-accent text-slate-900 hover:bg-amber-400 font-semibold',
      };
      return <button type={type} onClick={onClick} disabled={disabled} className={cls(base, styles[variant], className)}>{children}</button>;
      }

      function Card({ children, className='' }) {
      return <div className={cls('bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm', className)}>{children}</div>;
      }

      function Input({ value, onChange, placeholder, type='text', className='' }) {
      return <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      className={cls('w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary', className)} />;
      }

      }

      function Spinner({ className='w-4 h-4' }) {
      return <svg className={cls('animate-spin', className)} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/></svg>;
      }

      /* ---------------- Word Modal (Reading) ---------------- */
      function WordModal({ word, onClose, settings, onSpeak, onSaveVocab, contextSentence }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [saved, setSaved] = useState(false);

      useEffect(() => {
      setSaved(false);
      if (!word) return;
      (async () => {
      setLoading(true); setError(''); setData(null);
      try {
      const clean = word.toLowerCase().replace(/[^a-z'-]/g,'').trim();
      if (!clean) { setLoading(false); return; }
      const prompt = `You are an expert English vocabulary coach and bilingual lexicographer.

      TASK:
      Analyze the English word or phrase "${clean}" in the context of this sentence: "${contextSentence}".

      RULES:
      1. CONTEXT AWARENESS: Look at the sentence context. If "${clean}" is used as a proper noun (name of a person, place, etc., like "Anna" in "Meet Anna"), classify it as a Proper Noun, set translation to "${clean} (Nome próprio)", definition to "A person's name (Nome próprio)", and provide natural example sentences using it as a name.
      2. "translation": Provide the natural Brazilian Portuguese translation based on the context.
      3. "definition": Provide a clear, simple explanation in English, followed by its translation in Portuguese in parentheses.
      4. "examples": Provide an array of EXACTLY 3 practical real-world example sentences in English with their Portuguese translation in parentheses.

      OUTPUT FORMAT:
      Output strictly raw valid JSON. Do not include markdown code blocks (such as \`\`\`json).

      JSON Structure:
      {
        "translation": "...",
        "definition": "... (Tradução em português)",
        "examples": [
          "Example sentence 1 in English. (Tradução 1)",
          "Example sentence 2 in English. (Tradução 2)",
          "Example sentence 3 in English. (Tradução 3)"
        ]
      }`;
      const txt = await ollamaChat(settings.baseUrl, settings.apiKey, settings.model, [{role:'user', content: prompt}], 'Respond ONLY with valid JSON.');
      const parsed = parseJSON(txt);
      if (!parsed) throw new Error('Could not parse response');
      setData({
      translation: safeText(parsed.translation),
      definition: safeText(parsed.definition),
      examples: Array.isArray(parsed.examples) ? parsed.examples.map(safeText) : (parsed.examples ? [safeText(parsed.examples)] : []),
      });
      } catch (e) { setError(e.message); }
      finally { setLoading(false); }
      })();
      }, [word, settings.baseUrl, settings.apiKey, settings.model]);

      if (!word) return null;
      const cleanWord = (word || '').toLowerCase().replace(/[^a-z'-]/g,'').trim();

      return (
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50" onClick={onClose}>
      <div className="popover w-full max-w-lg bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl p-5 max-h-[85vh] overflow-auto" onClick={e=>e.stopPropagation()}>

      <h3 className="text-xl font-bold capitalize text-slate-900 dark:text-slate-100">{cleanWord || word}</h3>
      <button onClick={onClose} className="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200"><Icon name="x" className="w-5 h-5"/></button>

      {loading && <div className="flex items-center gap-2 py-6 justify-center text-slate-700 dark:text-slate-200"><Spinner/> <span>Looking up...</span></div>}

      <div>
      <div className="text-xs uppercase text-slate-500 dark:text-slate-400 mb-1">Portuguese translation</div>
      <div className="font-medium text-accent">{data.translation}</div>
    </div>

      <div>{data.definition}</div>
    </div>
      <div>
      <div className="text-xs uppercase text-slate-500 dark:text-slate-400 mb-1">Examples</div>
      <ul className="space-y-2">
      {(data.examples||[]).map((ex,i) => (
      <li key={i} className="flex items-start gap-2 bg-slate-50 dark:bg-slate-800 rounded-lg p-2">

      /* ---------------- Translator (with direction toggle) ---------------- */
      function TranslatorPanel({ settings }) {

      const targetLang = ptToEn ? 'English' : 'Portuguese (PT-BR)';
      const prompt = `You are an expert bilingual lexicographer and translator specialized in English and Brazilian Portuguese.

      Task: Translate the text from ${sourceLang} to ${targetLang}.

      CRITICAL TRANSLATION RULES:
      1. NEVER perform literal, word-for-word translation for idioms, expressions, phrasal verbs, or slang (e.g., "cry wolf" -> "dar alarme falso", "piece of cake" -> "mamão com açúcar"). Always use the most natural, culturally equivalent phrase in ${targetLang}.
      2. If the input is a single word or phrase with multiple common meanings, provide the primary natural translation first, followed by any common alternative in parentheses.

      Return your response strictly in valid JSON format with this structure:
      {
        "translation": "Natural equivalent translation",
        "notes": [
          "Explanation of context, origin, or nuance written in Portuguese (PT-BR)",
          "Exemplo prático: \"[Sentence in source language]\" ([Translation in target language])"
        ]
      }

      Text to translate:
      """
      ${input}
      """`;
      const txt = await ollamaChat(settings.baseUrl, settings.apiKey, settings.model, [{role:'user', content: prompt}], 'Respond ONLY with valid JSON.');

      setResult({
      translation: safeText(parsed.translation),
      notes: Array.isArray(parsed.notes) ? parsed.notes.map(safeText) : (parsed.notes ? [safeText(parsed.notes)] : []),

      <span className="text-lg">⇄</span>
    </button>

    </div>
      <span className="text-xs text-slate-500">{isPtToEn ? 'Portuguese → English' : 'English → Portuguese'}</span>
    </div>
      <Textarea value={input} onChange={setInput} placeholder={isPtToEn ? 'Digite uma frase em português...' : 'Type a sentence in English...'} className="min-h-[80px]"/>
      <Button onClick={run} disabled={loading}>{loading ? <Spinner/> : <Icon name="sparkles" className="w-4 h-4"/>} Translate</Button>
      {error && <div className="text-red-600 dark:text-red-400 text-sm">{error}</div>}
      {result && (
      <div className="space-y-3 pt-3 border-t border-slate-200 dark:border-slate-700">
      <div>
      <div className="text-xs uppercase text-slate-500 dark:text-slate-400 mb-1">Translation</div>
      <div className="font-medium text-primary text-lg">{result.translation}</div>
    </div>
      {result.notes?.length > 0 && (
      <div>
      <div className="text-xs uppercase text-slate-500 dark:text-slate-400 mb-1">Notes (PT-BR)</div>
      <ul className="list-disc list-inside text-sm space-y-1 text-slate-800 dark:text-slate-100">
      {result.notes.map((n,i)=><li key={i}>{safeText(n)}</li>)}
    </ul>
    </div>
      )}
    </div>
      )}
    </Card>

      );

      /* ---------------- Chat ---------------- */
      function ChatPanel({ settings, onSpeak }) {
      const [scenario, setScenario] = useState('casual');
      const [chats, setChats] = useLocalStorage('linguaai_chats', {});
      const [messages, setMessages] = useState(chats[scenario] || []);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const bottomRef = useRef(null);
      const recRef = useRef(null);
      const [listening, setListening] = useState(false);

      useEffect(() => { setMessages(chats[scenario] || []); }, [scenario]);
      useEffect(() => { if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: 'smooth' }); }, [messages, loading]);

      const persist = (next) => {
      setMessages(next);
      setChats(prev => ({ ...prev, [scenario]: next }));
      };

      const send = async (textOverride) => {
      const text = (textOverride ?? input).trim();
      if (!text) return;
      if (!settings.model) { setError('Select a model in Settings first.'); return; }
      setError('');
      const userMsg = { role: 'user', content: text };
      const next = [...messages, userMsg];
      persist(next);
      setInput('');
      setLoading(true);
      try {
      const sc = SCENARIOS.find(s=>s.id===scenario) || SCENARIOS[2];
      const system = `You are a friendly, encouraging English conversation partner.

      ROLE & SCENARIO:
      - Scenario: ${sc.name}
      - Scenario Details: ${sc.prompt}

      RULES FOR YOUR RESPONSE:
      1. "reply": Respond naturally in English (1 to 3 short sentences max) to maintain a fluid, engaging dialogue. Ask an open-ended question to keep the conversation going.
      2. "feedback": Analyze the user's latest input for grammar, spelling, punctuation, or natural phrasing:
         ${settings.bilingual
           ? '- If there are errors or awkward phrasing, explain them clearly in PORTUGUESE (PT-BR). Show the correct/natural version and briefly explain why.\n   - If the user\'s sentence is correct, write a short compliment in PORTUGUESE (PT-BR) and suggest 1 alternative, more natural or idiomatic way to say it.'
           : '- If there are errors, explain them briefly in ENGLISH and show the corrected sentence.\n   - If correct, leave this field empty or provide a quick compliment.'}

      OUTPUT FORMAT:
      Return strictly raw valid JSON without markdown formatting (do not use \`\`\`json).
      Structure:
      {
        "reply": "English reply text here...",
        "feedback": "Grammar feedback or tip here..."
      }`;
      const llmMessages = next.map(m => ({ role: m.role, content: m.content }));
      const txt = await ollamaChat(settings.baseUrl, settings.apiKey, settings.model, llmMessages, system, 0.7);
      const parsed = parseJSON(txt);
      const reply = safeText(parsed?.reply || txt);
      const feedback = safeText(parsed?.feedback || '');
      const assistantMsg = { role: 'assistant', content: reply, feedback };
      persist([...next, assistantMsg]);
      if (settings.autoPlay) onSpeak(reply);
      } catch (e) { setError(e.message); }
      finally { setLoading(false); }
      };

      const startListening = () => {
      if (!SpeechRec) { setError('Speech recognition not supported in this browser.'); return; }
      try {
      const rec = new SpeechRec();
      rec.lang = settings.accent;
      rec.interimResults = false;
      rec.onresult = (e) => { const t = e.results[0][0].transcript; setInput(t); };
      rec.onend = () => setListening(false);
      rec.onerror = (e) => { setError('Mic error: ' + e.error); setListening(false); };
      recRef.current = rec;
      setListening(true);
      rec.start();
      } catch (e) { setError(e.message); setListening(false); }
      };
      const stopListening = () => { try { recRef.current?.stop(); } catch {} setListening(false); };
      const clearChat = () => persist([]);

      return (
      <div className="max-w-3xl mx-auto flex flex-col h-[calc(100vh-8rem)]">
      <div className="flex items-center justify-between mb-3">
      <h2 className="text-xl font-bold flex items-center gap-2 text-slate-900 dark:text-slate-100"><Icon name="message-circle"/> Writing Practice</h2>
      <div className="flex items-center gap-2">
      <select value={scenario} onChange={e=>setScenario(e.target.value)} className="px-2 py-1 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-sm">
      {SCENARIOS.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
    </select>
      <Button variant="ghost" onClick={clearChat}><Icon name="trash-2" className="w-4 h-4"/></Button>
    </div>
    </div>
      <Card className="flex-1 flex flex-col overflow-hidden">
      <div className="flex-1 overflow-auto p-4 space-y-3">
      {messages.length === 0 && <div className="text-center text-slate-500 dark:text-slate-400 py-10">Start the conversation. Write in English!</div>}
      {messages.map((m, i) => (
      <div key={i} className={cls('flex', m.role==='user' ? 'justify-end' : 'justify-start')}>
      <div className={cls('max-w-[80%] rounded-2xl px-4 py-2', m.role==='user' ? 'bg-primary text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100')}>
      <div className="chat-bubble">{m.content}</div>
      {m.role==='assistant' && (
      <div className="flex items-center gap-2 mt-1">
      <button onClick={()=>onSpeak(m.content)} className="text-slate-400 hover:text-primary"><Icon name="volume-2" className="w-4 h-4"/></button>
    </div>
      )}
      {m.role==='assistant' && m.feedback && (
      <div className="mt-2 p-2 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-700 text-sm text-slate-900 dark:text-slate-100">
      <div className="text-xs font-semibold text-amber-700 dark:text-amber-400 mb-1">Feedback (PT)</div>
      <div className="whitespace-pre-wrap">{m.feedback}</div>
    </div>
      )}
    </div>
    </div>
      ))}
      {loading && <div className="flex justify-start"><div className="bg-slate-100 dark:bg-slate-800 rounded-2xl px-4 py-2 flex items-center gap-2 text-slate-900 dark:text-slate-100"><Spinner/> thinking...</div></div>}
      <div ref={bottomRef}/>
    </div>
      {error && <div className="px-4 py-1 text-red-600 dark:text-red-400 text-sm">{error}</div>}
      <div className="border-t border-slate-200 dark:border-slate-700 p-3 flex gap-2">
      <button onClick={listening ? stopListening : startListening}
      className={cls('p-2 rounded-lg border', listening ? 'bg-red-600 text-white border-red-600' : 'border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800')}>
      <Icon name="mic" className="w-5 h-5"/>
    </button>
      <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } }}
      placeholder="Type your message in English..." className="flex-1 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary"/>
      <Button onClick={()=>send()} disabled={loading || !input.trim()}><Icon name="send" className="w-4 h-4"/></Button>
    </div>
    </Card>
    </div>
      );
      }

      const article = DEFAULT_ARTICLES.find(a=>a.id===articleId) || levelArticles[0];

      useEffect(() => {
      if (!levelArticles.find(a=>a.id===articleId)) setArticleId(levelArticles[0]?.id);
      }, [level]);

      const handleSave = (word, data) => {
      if (onSaveVocab) onSaveVocab(word, normalizeVocabData(data));
      setSavedWords(prev => ({ ...prev, [word]: true }));
      };

      const [quiz, setQuiz] = useState(null);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizLoading, setQuizLoading] = useState(false);
      const [quizError, setQuizError] = useState('');

      const genQuiz = async () => {
      if (!settings.model || !article) { setQuizError('Select model/article.'); return; }
      setQuizLoading(true); setQuizError(''); setQuiz(null); setQuizAnswers({});
      try {
        const prompt = `You are an expert English language teacher creating a reading comprehension assessment.

        TASK:
        Create a 3-question multiple-choice quiz based on the English article provided below.

        ARTICLE CONTENT:
        """
        ${article.text}
        """

        RULES FOR QUIZ GENERATION:
        1. "question": Write clear, well-phrased comprehension questions in ENGLISH testing main ideas, key details, or vocabulary context.
        2. "options": Provide EXACTLY 4 plausible options (strings in English). Avoid absurd distractors—make them challenge the reader's understanding.
        3. "answerIndex": The 0-based index (0, 1, 2, or 3) of the single correct option.
        4. "explanation": Write a detailed, helpful pedagogical explanation in PORTUGUESE (PT-BR). Explain WHY the answer is correct and briefly reference the part of the article that supports it.

        OUTPUT FORMAT:
        Return strictly raw valid JSON. Do not include markdown code blocks (such as \`\`\`json).

        JSON Structure:
        {
          "questions": [
            {
              "question": "English question text...",
              "options": ["Option A", "Option B", "Option C", "Option D"],
              "answerIndex": 0,
              "explanation": "Explicação em português detalhando o motivo da resposta estar certa com base no texto."
            }
          ]
        }`;
      const txt = await ollamaChat(settings.baseUrl, settings.apiKey, settings.model, [{role:'user', content: prompt}], 'Respond ONLY with valid JSON.', 0.3);
      const parsed = parseJSON(txt);
      if (!parsed?.questions) throw new Error('Could not parse quiz');
      setQuiz(parsed.questions);
      } catch (e) { setQuizError(e.message); }
      finally { setQuizLoading(false); }
      };

      const tokens = (article?.text || '').match(/\w+|[^\w\s]+|\s+/g) || [];

      return (
      <div className="max-w-3xl mx-auto space-y-4">
      <h2 className="text-2xl font-bold flex items-center gap-2 text-slate-900 dark:text-slate-100"><Icon name="book-open"/> Reading Practice</h2>
      <div className="flex flex-wrap gap-3 items-center">
      <div className="flex items-center gap-2">
      <span className="text-sm text-slate-500 dark:text-slate-400">Level:</span>
      {['A1','A2','B1','B2','C1'].map(l => (
      <button key={l} onClick={()=>setLevel(l)} className={cls('px-3 py-1 rounded-full text-sm border transition', level===l ? 'bg-primary text-white border-primary' : 'border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800')}>{l}</button>
      ))}
    </div>
      <select value={articleId} onChange={e=>setArticleId(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100">
      {levelArticles.map(a=><option key={a.id} value={a.id}>{a.title}</option>)}
    </select>
    </div>
      <Card className="p-5">
      <div className="text-lg font-semibold mb-3 text-slate-900 dark:text-slate-100">{article?.title}</div>
      <div className="text-base leading-relaxed text-slate-800 dark:text-slate-100">
      {tokens.map((tok,i) => {
      if (/^\w+$/.test(tok)) {
      return <button key={i} onClick={()=>setSelectedWord(tok)} className="hover:text-primary hover:underline cursor-pointer">{tok}</button>;
      }
      return <span key={i}>{tok}</span>;
      })}
    </div>
      <p className="text-xs text-slate-500 dark:text-slate-400 mt-3">Click any word to see translation, definition and examples.</p>
    </Card>

      <div className="flex items-center gap-2">
      <Button onClick={genQuiz} disabled={quizLoading}>{quizLoading ? <Spinner/> : <Icon name="sparkles" className="w-4 h-4"/>} Generate Quiz</Button>
    </div>
      {quizError && <div className="text-red-600 dark:text-red-400 text-sm">{quizError}</div>}
      {quiz && (
      <Card className="p-5 space-y-4">
      <h3 className="font-semibold text-slate-900 dark:text-slate-100">Comprehension Quiz</h3>
      {quiz.map((q, qi) => (
      <div key={qi} className="space-y-2">
      <div className="font-medium text-slate-900 dark:text-slate-100">{qi+1}. {safeText(q.question)}</div>
      <div className="space-y-1">
      {q.options.map((opt, oi) => {
      const answered = quizAnswers[qi] !== undefined;
      const chosen = quizAnswers[qi] === oi;
      const correct = q.answerIndex === oi;
      let style = 'w-full text-left px-3 py-2 rounded-lg border text-sm transition text-slate-900 dark:text-slate-100 ';
      if (answered) {
      if (correct) style += 'bg-green-100 dark:bg-green-900/30 border-green-500';
      else if (chosen) style += 'bg-red-100 dark:bg-red-900/30 border-red-500';
      else style += 'border-slate-300 dark:border-slate-700';
      } else style += 'border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer';
      return <button key={oi} disabled={answered} onClick={()=>setQuizAnswers(prev=>({...prev,[qi]:oi}))} className={style}>{String.fromCharCode(65+oi)}. {safeText(opt)}</button>;
      })}
    </div>
      {quizAnswers[qi] !== undefined && (
      <div className={cls('text-sm p-2 rounded-lg', quizAnswers[qi]===q.answerIndex ? 'text-green-700 dark:text-green-400' : 'text-red-700 dark:text-red-400')}>
      {quizAnswers[qi]===q.answerIndex ? 'Correto! ' : 'Incorreto. '}{safeText(q.explanation)}
    </div>
      )}
    </div>
      ))}
    </Card>
      )}

      <WordModal word={selectedWord} contextSentence={article.text} onClose={()=>setSelectedWord(null)} settings={settings} onSpeak={onSpeak} onSaveVocab={handleSave} />
    </div>
      );
      }

      /* ---------------- Speaking ---------------- */
      function SpeakingPractice({ settings, onSpeak }) {

        'Can you recommend a good hotel nearby?',

        // 🍽️ Restaurantes, Bares e Compras
        'I would like to order the chicken, please.',
        'Could we have the bill, please?',
        'Do you have any vegetarian options?',
        'I am just browsing, thank you.',

        'I am really looking forward to the weekend.',

        'Sorry to bother you, but do you have the time?',
        'Let\'s keep in touch!',

        // 💻 Trabalho e Reuniões (Business English)
        'Could you send me the details via email?',
        'Let\'s schedule a call for tomorrow morning.',
        'I agree with your point of view.',
        'We need to finish this project by Friday.',
        'Thank you for your quick response.',
        'Could you clarify that last point?',
        'I am running a few minutes late.',
        'What are the next steps for our team?',
        'Please let me know if you have any questions.',
        'I will get back to you as soon as possible.',

        // 🆘 Emergências e Pedidos de Ajuda

        'Where is the nearest hospital or pharmacy?',
        'Could you call an ambulance, please?',
        'I lost my wallet and passport.',
        'Can you help me carry this bag?',
        'Is there a doctor who speaks English here?',
        'Where is the emergency exit?',
        'Please call the police immediately!',
        'I need to contact my family.',
        'Everything is going to be okay.'
      ]);
      const [phraseIdx, setPhraseIdx] = useState(0);
      const [transcript, setTranscript] = useState('');
      const recRef = useRef(null);
      const [listening, setListening] = useState(false);
      const [feedback, setFeedback] = useState('');

      const playPhrase = () => onSpeak(phrases[phraseIdx]);

      const startRec = () => {
      if (!SpeechRec) { setFeedback('Speech recognition not supported.'); return; }
      const rec = new SpeechRec();
      rec.lang = settings.accent;
      rec.onresult = (e) => setTranscript(e.results[0][0].transcript);
      rec.onend = () => setListening(false);
      rec.onerror = (e) => { setFeedback('Mic error: '+e.error); setListening(false); };
      recRef.current = rec;
      setListening(true); setTranscript('');
      rec.start();
      };
      const stopRec = () => { try { recRef.current?.stop(); } catch {} setListening(false); };

      const compare = () => {
      if (!settings.model) { setFeedback('Select a model in Settings.'); return; }
      (async () => {
      try {
      setFeedback('Analyzing...');
      const prompt = `You are an expert English pronunciation coach and speech therapist.
      The student is a native Portuguese (PT-BR) speaker practicing English pronunciation.

      Target phrase: "${phrases[phraseIdx]}"
      What the user actually said (transcript): "${transcript}"

      TASK:
      Evaluate the pronunciation and accuracy of the student's speech by comparing the target phrase with their transcript.

      RULES:
      1. Write brief, constructive feedback in Portuguese (PT-BR) (2 to 4 sentences).
      2. If there are noticeable differences or mispronunciations inferred from the transcript, highlight which specific words need attention and give a pronunciation tip.
      3. If the speech matches well or is close, praise the student and encourage them, but keep it concise.
      4. Output plain text ONLY (do not use JSON, do not use markdown code blocks).`;
      const txt = await ollamaChat(settings.baseUrl, settings.apiKey, settings.model, [{role:'user', content: prompt}], 'You are a friendly speaking coach. Reply in Portuguese.');
      setFeedback(txt);
      } catch (e) { setFeedback('Error: '+e.message); }
      })();
      };

      return (
      <div className="max-w-3xl mx-auto space-y-4">
      <h2 className="text-2xl font-bold flex items-center gap-2 text-slate-900 dark:text-slate-100"><Icon name="headphones"/> Speaking & Listening</h2>
      <div className="flex gap-2">
      <button onClick={()=>setTab('voice')} className={cls('px-4 py-2 rounded-lg font-medium transition', tab==='voice'?'bg-primary text-white shadow-sm':'bg-slate-200 text-slate-900 dark:bg-slate-800 dark:text-slate-100 hover:bg-slate-300 dark:hover:bg-slate-700')}>Voice Chat</button>
      <button onClick={()=>setTab('repeat')} className={cls('px-4 py-2 rounded-lg font-medium transition', tab==='repeat'?'bg-primary text-white shadow-sm':'bg-slate-200 text-slate-900 dark:bg-slate-800 dark:text-slate-100 hover:bg-slate-300 dark:hover:bg-slate-700')}>Listen & Repeat</button>
    </div>
      {tab === 'voice' && <ChatPanel settings={settings} onSpeak={onSpeak} />}
      {tab === 'repeat' && (
      <Card className="p-5 space-y-4">
      <div className="text-lg font-semibold text-slate-900 dark:text-slate-100">{phrases[phraseIdx]}</div>
      <div className="flex gap-2">
      <Button onClick={playPhrase}><Icon name="play" className="w-4 h-4"/> Play</Button>
      <Button variant="secondary" onClick={()=>setPhraseIdx((phraseIdx+1)%phrases.length)}>Next</Button>
    </div>
      <div>
      <Button onClick={listening ? stopRec : startRec} variant={listening ? 'danger' : 'primary'} className="min-w-[190px] justify-center">
      <Icon name="mic" className="w-4 h-4"/> {listening ? 'Stop recording' : 'Record your voice'}
    </Button>
    </div>
      <div className="bg-slate-50 dark:bg-slate-800 rounded-lg p-3 text-sm min-h-[48px] text-slate-900 dark:text-slate-100">
      <span className="text-slate-500 dark:text-slate-400">Transcript: </span>{transcript || '—'}
    </div>
      <Button onClick={compare} disabled={!transcript}>Get AI Feedback</Button>
      {feedback && <div className="text-sm p-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-700 text-slate-900 dark:text-slate-100 whitespace-pre-wrap">{feedback}</div>}
    </Card>
      )}
    </div>
      );
      }

      /* ---------------- Vocabulary (full manager) ---------------- */
      function Vocabulary({ data, setData, onSpeak }) {
      const [search, setSearch] = useState('');
      const [openId, setOpenId] = useState(null);
      const filtered = (data || []).filter(v => (v.word || '').toLowerCase().includes(search.toLowerCase()));

      const remove = (w) => {
      setData(prev => (prev || []).filter(v => v.word !== w));
      if (openId === w) setOpenId(null);
      };

      return (
      <div className="max-w-3xl mx-auto space-y-4">
      <h2 className="text-2xl font-bold flex items-center gap-2 text-slate-900 dark:text-slate-100"><Icon name="bookmark"/> My Vocabulary</h2>
      <Input value={search} onChange={setSearch} placeholder="Search saved words..."/>
      {filtered.length === 0 && <div className="text-center text-slate-500 dark:text-slate-400 py-10">No saved words yet. Save words from Word Lookup or Reading.</div>}
      <div className="grid sm:grid-cols-2 gap-3">
      {filtered.map(v => {
      const isOpen = openId === v.word;
      const d = normalizeVocabData(v.data || {});
      return (
      <Card key={v.word} className="p-4 space-y-2">
      <div className="flex items-center justify-between">
      <div className="font-bold capitalize text-slate-900 dark:text-slate-100">{v.word}</div>
      <div className="flex items-center gap-2">
      <button onClick={() => onSpeak(v.word)} className="text-slate-400 hover:text-primary" title="Listen pronunciation"><Icon name="volume-2" className="w-4 h-4"/></button>
      <button onClick={() => setOpenId(isOpen ? null : v.word)} className="text-slate-400 hover:text-primary" title="View details"><Icon name={isOpen ? 'chevron-down' : 'chevron-right'} className="w-4 h-4"/></button>
      <button onClick={() => remove(v.word)} className="text-slate-400 hover:text-red-500" title="Delete"><Icon name="trash-2" className="w-4 h-4"/></button>
    </div>
    </div>
      {d?.translation && <div className="text-accent text-sm font-medium">{safeText(d.translation)}</div>}
      {isOpen && (
      <div className="space-y-2 pt-2 border-t border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-slate-100">
      {d?.definition && <div><span className="text-xs uppercase text-slate-500 dark:text-slate-400">Definition: </span>{safeText(d.definition)}</div>}
      {Array.isArray(d?.examples) && d.examples.length > 0 && (
      <div>
      <div className="text-xs uppercase text-slate-500 dark:text-slate-400 mb-1">Examples</div>
      <ul className="space-y-2">
      {d.examples.map((ex, i) => (
      <li key={i} className="flex items-start gap-2 bg-slate-50 dark:bg-slate-800 rounded-lg p-2">
      <span className="text-primary">•</span>
      <span className="flex-1">{safeText(ex)}</span>
      <button onClick={() => onSpeak(ex)} className="text-slate-400 hover:text-primary"><Icon name="volume-2" className="w-3 h-3"/></button>
    </li>
      ))}
    </ul>
    </div>
      )}
    </div>
      )}
    </Card>
      );
      })}

      );

      /* ---------------- App ---------------- */
      function App() {
      const [rawSettings, setRawSettings] = useLocalStorage('linguaai_settings', DEFAULT_SETTINGS);
      const settings = normalizeSettings(rawSettings);
      const setSettings = (updater) => setRawSettings(prev => {
      const prevNorm = normalizeSettings(prev);
      const next = typeof updater === 'function' ? updater(prevNorm) : updater;
      return normalizeSettings(next);
      });

      const [vocab, setVocab] = useLocalStorage('linguaai_vocab', []);
      const [route, setRoute] = useState('dashboard');
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [floating, setFloating] = useState(null);

      const theme = settings.theme || 'dark';

      useEffect(() => {
      document.documentElement.classList.toggle('dark', theme === 'dark');
      }, [theme]);

      useEffect(() => {
      if (!rawSettings?.theme) {
      setRawSettings(s => ({ ...normalizeSettings(s), theme: 'dark' }));
      }
      }, []);

      const tts = useTTS(settings);
      const speak = tts.speak;

      const saveVocab = (word, data) => {
      const clean = (word || '').toLowerCase().trim();
      if (!clean) return;
      setVocab(prev => {
      const list = Array.isArray(prev) ? prev : [];
      const exists = list.some(v => v.word === clean);
      if (exists) return list;
      return [...list, { word: clean, data: normalizeVocabData(data) || data, savedAt: Date.now() }];
      });
      };

      const navigate = (r) => setRoute(r);

      const sidebarItems = [
      { id:'dashboard', label:'Dashboard', icon:'home' },
      { id:'writing', label:'Writing', icon:'message-circle' },
      { id:'reading', label:'Reading', icon:'book-open' },
      { id:'speaking', label:'Speaking', icon:'headphones' },
      { id:'translator', label:'Translator', icon:'globe' },
      { id:'lookup', label:'Word Lookup', icon:'search' },
      { id:'vocab', label:'Vocabulary', icon:'bookmark' },
      { id:'settings', label:'Settings', icon:'settings' },
      ];

      const rootClass = theme === 'dark' ? 'dark' : '';

      return (
      <div className={rootClass}>
      <div className="min-h-screen flex">
      <aside className={cls('fixed lg:static inset-y-0 left-0 z-30 w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700 transform transition-transform', sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0 lg:w-16')}>
      <div className="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-700">
      {sidebarOpen && <div className="font-bold text-lg text-primary">LinguaIA Coach</div>}
      <button onClick={()=>setSidebarOpen(o=>!o)} className="p-1 rounded text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800">
      <Icon name={sidebarOpen?'chevron-left':'chevron-right'}/>
    </button>
    </div>
      <nav className="p-2 space-y-1">
      {sidebarItems.map(it => (
      <button key={it.id} onClick={()=>setRoute(it.id)}
      className={cls('w-full flex items-center gap-3 px-3 py-2 rounded-lg transition', route===it.id ? 'bg-primary text-white shadow-sm' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800')}>
      <Icon name={it.icon} className="w-5 h-5 flex-shrink-0"/>
      {sidebarOpen && <span className="text-sm font-medium">{it.label}</span>}
    </button>
      ))}
    </nav>
      <div className="p-3 border-t border-slate-200 dark:border-slate-700 mt-auto">
      <button onClick={()=>setSettings(s=>({...s,theme:s.theme==='dark'?'light':'dark'}))} className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800">
      <Icon name={theme==='dark'?'sun':'moon'} className="w-5 h-5"/>
      {sidebarOpen && <span className="text-sm font-medium">{theme==='dark'?'Light mode':'Dark mode'}</span>}
    </button>
    </div>
    </aside>
      {sidebarOpen && <div className="lg:hidden fixed inset-0 bg-black/40 z-20" onClick={()=>setSidebarOpen(false)}/>}

      <div className="lg:hidden fixed top-0 left-0 right-0 z-20 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 px-4 py-2 flex items-center justify-between">
      <button onClick={()=>setSidebarOpen(true)} className="p-1 text-slate-700 dark:text-slate-200"><Icon name="menu"/></button>
      <div className="font-bold text-primary">LinguaIA Coach</div>
      <button onClick={()=>setSettings(s=>({...s,theme:s.theme==='dark'?'light':'dark'}))} className="p-1 text-slate-700 dark:text-slate-200"><Icon name={theme==='dark'?'sun':'moon'}/></button>
    </div>

      <main className="flex-1 min-w-0 p-4 lg:p-6 pt-14 lg:pt-6 overflow-auto">
      {route === 'dashboard' && <Dashboard onNavigate={navigate}/>}
      {route === 'settings' && <SettingsPanel settings={settings} setSettings={setSettings}/>}
      {route === 'writing' && <ChatPanel settings={settings} onSpeak={speak}/>}
      {route === 'reading' && <ReadingPractice settings={settings} onSpeak={speak} onSaveVocab={saveVocab}/>}
      {route === 'speaking' && <SpeakingPractice settings={settings} onSpeak={speak}/>}
      {route === 'translator' && <TranslatorPanel settings={settings}/>}
      {route === 'lookup' && <LookupPanel settings={settings} onSaveVocab={saveVocab}/>}
      {route === 'vocab' && <Vocabulary data={vocab} setData={setVocab} onSpeak={speak}/>}
    </main>

      <FloatingToolbar onOpen={setFloating}/>
      <FloatingModal kind={floating} onClose={()=>setFloating(null)} settings={settings} onSaveVocab={saveVocab}/>
    </div>
    </div>
      );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
